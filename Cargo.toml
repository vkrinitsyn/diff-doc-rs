
[package]
name = "diff_doc"
version = "0.8.1"
edition = "2024"
description = "A document diffing library supporting multiple formats (JSON, YAML, XML, TOML)."
license = "MIT"
repository = "https://github.com/vkrinitsyn/diff-doc-rs"
authors = ["Vladimir Krinitsyn"]


[dependencies]

# plain text diff
diffy= { version = "0.5", optional = true }

serde_json = { version = "1.0", features = ["arbitrary_precision"] }

serde = { version = "1.0", features = ["derive", "serde_derive", "std"] }
# XML (xml.rs): read into a GenericValue by this crate's own mapping. Not serde-xml-rs:
# it has no deserialize_any. roxmltree forbids unsafe code and needs no other crate
roxmltree = "^0.21"

# YAML (generic.rs). Not serde_yaml: deprecated, and its unsafe-libyaml is
# unmaintained (RUSTSEC-2024-0449). serde-saphyr has no unsafe code; ^1.3 as etcds
serde-saphyr = "^2.0"
toml = "^1"
# the messages, in locales/*.yml: compiled in, each in every language - see src/i18n.rs
# (no i18n table name in brackets anywhere in this file: rust-i18n would read it as
# its configuration)
rust-i18n = { version = "^4.2.4", optional = true }


[features]
default = ["i18n"]
# the messages in every language of locales/*.yml, and set_lang; without it English only
i18n = ["dep:rust-i18n"]
patch = ["dep:diffy"]
verbose = [] # exta debug messages
